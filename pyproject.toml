[project]
name = "sferic-collector"
version = "0.1.0"
description = "sferic fleet collector — companion MCP server + strike/flash store (ADR-0003)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ry-ops" }]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
]

[project.scripts]
sferic-collector = "sferic_collector.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sferic_collector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
