[project]
name = "sferic-collector"
version = "0.1.0"
description = "sferic fleet collector — companion MCP server + strike/flash store (ADR-0003)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ry-ops" }]
dependencies = [
    "mcp>=2.0",
    "pydantic>=2.6",
    "pyserial>=3.5",
    "starlette>=0.40",   # WS listener for networked stations (ADR-0009)
    "uvicorn>=0.30",
    "websockets>=13",    # fake-station dev client (also used by the e2e test)
]

[project.scripts]
sferic-collector = "sferic_collector.__main__:main"
sferic-fake-station = "sferic_collector.fake_station:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",   # Starlette TestClient — WS listener tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sferic_collector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
